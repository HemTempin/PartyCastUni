plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.partycastmvp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.partycastmvp'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.9.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


kotlin {
    jvmToolchain(17)
}
