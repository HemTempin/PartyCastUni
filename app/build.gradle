plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.partycastmvp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.partycastmvp'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.8.1-partycast-queue-fix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


kotlin {
    jvmToolchain(17)
}
