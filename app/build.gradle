plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = System.getenv('PARTYCAST_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('PARTYCAST_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('PARTYCAST_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PARTYCAST_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.example.partycastmvp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.partycastmvp'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '1.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


kotlin {
    jvmToolchain(17)
}
